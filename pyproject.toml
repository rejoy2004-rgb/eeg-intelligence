[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-intelligence"
version = "0.1.0"
description = "Explainable EEG motor-imagery analysis inspired by EEGLearn (Bashivan et al., 2016)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "mne>=1.6", "scikit-learn>=1.4",
  "matplotlib>=3.8", "plotly>=5.18", "pyyaml>=6.0", "torch>=2.2",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["realdata: needs the real BCI IV 2a files in data/raw"]
